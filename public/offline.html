<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline · Office Ledger</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f9fafc; --surface: #fff; --text: #1b1f2e; --muted: #5b6275; --border: #e3e6ef; --primary: #4256d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #12141c; --surface: #1a1d28; --text: #eef0f6; --muted: #a9afc0; --border: #2e3344; --primary: #8195ff; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 16px; }
      main { max-width: 420px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; }
      @media (prefers-color-scheme: dark) { a { color: #12141c; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="48" height="48" />
      <h1>You're offline</h1>
      <p>Office Ledger needs a connection to load live attendance and approvals. Pages you opened recently may still be available.</p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
