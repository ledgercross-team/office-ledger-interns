name: CI

on:
  push:
    branches: [main, emran]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: office_ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/office_ledger
      TEST_DATABASE_URL: postgres://ledger:ledger@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      FILE_SIGNING_SECRET: ci-only-file-secret-0123456789abcdef
      CRON_SECRET: ci-cron
      PUBLIC_SITE_URL: http://localhost:4400
      BETTER_AUTH_URL: http://localhost:4400
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit & resolver tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
