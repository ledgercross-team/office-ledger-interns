services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: office_ledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d office_ledger"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/office_ledger
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HOST: 0.0.0.0
    ports: ["4321:4321"]
volumes:
  pgdata:
